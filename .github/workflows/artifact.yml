name: Release artifact
on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          submodules: recursive

      - name: Parse plugin name from Directory.Build.props
        id: plugin-name
        uses: mavrosxristoforos/get-xml-info@219e509082288b248df8a825f6c9abb323ef4e06 # 2.2.1
        with:
          xml-file: 'Directory.Build.props'
          xpath: '//PluginName'

      - name: Download latest artifact
        uses: dawidd6/action-download-artifact@7f871e041ed7fe12467d2d4196da8a466c5311ff # v22
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          name: ${{ steps.plugin-name.outputs.info }}
          check_artifacts: true
          skip_unpack: true

      - name: Attach artifact to release assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          overwrite: true
          file: ${{ steps.plugin-name.outputs.info }}.zip
